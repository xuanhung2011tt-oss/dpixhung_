<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DPI Configuration - Cấu hình DPI cho các thiết bị</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .search-section {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .search-section input,
        .search-section select {
            padding: 10px;
            margin: 5px;
            border: 2px solid #667eea;
            border-radius: 5px;
            font-size: 14px;
        }

        .search-section button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        .search-section button:hover {
            background: #764ba2;
        }

        .devices-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .device-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }

        .device-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .device-card h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .device-info {
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 14px;
        }

        .device-info p {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #f0f0f0;
            padding-bottom: 8px;
        }

        .device-info label {
            font-weight: 600;
            color: #333;
        }

        .device-info span {
            color: #667eea;
            font-weight: 500;
        }

        .category-title {
            color: white;
            font-size: 1.8em;
            margin: 30px 0 20px 0;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 DPI Configuration for Devices</h1>
        <h1 style="font-size: 1.2em; margin-top: -20px;">Cấu hình DPI cho các thiết bị</h1>

        <div class="search-section">
            <input type="text" id="searchInput" placeholder="Tìm kiếm thiết bị... (Search device)">
            <select id="categoryFilter">
                <option value="">-- Tất cả danh mục (All Categories) --</option>
                <option value="android">Android</option>
                <option value="iphone">iPhone</option>
                <option value="tablet">Tablet</option>
            </select>
            <button onclick="search()">🔍 Tìm kiếm (Search)</button>
            <button onclick="resetSearch()" style="background: #764ba2;">🔄 Đặt lại (Reset)</button>
            <button onclick="exportJSON()" style="background: #28a745;">📥 Export JSON</button>
            <button onclick="exportCSV()" style="background: #fd7e14;">📊 Export CSV</button>
        </div>

        <div id="devicesContainer"></div>
    </div>

    <script src="dpi-config.js"></script>
    <script src="script.js"></script>
</body>
</html>
